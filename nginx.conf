server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # redirecionamentos sem http://host:80 (o HTTPS fica com o Dokploy na frente)
    absolute_redirect off;

    # /abc sem barra vira /abc/ (os arquivos do jogo usam caminhos relativos)
    location = /abc { return 301 /abc/; }
    location = / { return 301 /abc/; }

    # página, service worker e manifesto sempre conferidos: os aparelhos pegam a versão nova
    location ~* (\.html|/service-worker\.js|/manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* /abc/$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
